<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSO Client Demo</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <p class="eyebrow">Client App Demo</p>
        <h1>Đăng nhập vào ứng dụng</h1>
        <p class="description">Kiểm thử Authorization Code Flow của hệ thống SSO.</p>

        <div id="login-view">
          <button id="show-form-button" class="primary-button">Login with SSO</button>

          <form id="authorization-form" class="hidden">
            <label for="client-id">Client ID</label>
            <input id="client-id" name="clientId" required autocomplete="off" />

            <label for="redirect-uri">Redirect URL</label>
            <input id="redirect-uri" name="redirectUri" required autocomplete="url" />

            <button class="primary-button" type="submit">Tiếp tục với SSO</button>
          </form>
        </div>

        <div id="callback-view" class="hidden">
          <div class="code-block">
            <span>Authorization code</span>
            <code id="authorization-code"></code>
          </div>

          <form id="exchange-form">
            <label for="client-secret">Client Secret</label>
            <input id="client-secret" name="clientSecret" type="password" required autocomplete="off" />

            <button class="primary-button" type="submit">Đổi code lấy thông tin user</button>
          </form>
        </div>

        <p id="status-message" class="status hidden"></p>
        <pre id="result" class="result hidden"></pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
